<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./static/css/index.css">
	<script src="./static/js/script.js" defer></script>
	<title>Notefy - Take Notes [Offline]</title>
</head>

<body>
	<!-- Status Bar -->
	<aside class="sideBar" id="sideBar" style="grid-area: sideBar;">
		<h1 class="appName">NOTEFY</h1>

		<div id="futureDynamicContent">
		</div>

		<div class="profileShow">
			<!-- <div id="profileImage" class="profileImage"></div> -->
			<h3 class="profileName">@arijit.dev</h3>
		</div>
	</aside>

	<!-- NavBar / Main Data Show -->
	<div class="navBar" style="grid-area: navBar;">
		<div class="headText">My Notes</div>
		<div class="features">
			<button class="navAddnoteBtn" id="navAddnoteBtn"> <span>+</span> Add Note</button>
			<div class="themeControl">
				<button id="dayModeBtn" class="dayModeBtn">🌞</button>
				<button id="nightModeBtn" class="nightModeBtn">🌙</button>
			</div>
		</div>
	</div>

	<!-- Notes Container [Dynamic Content] -->
	<main class="notesContainer" id="notesContainer" style="grid-area: notesContainer;"></main>

	<!-- Notes Form [Input and Edit and Delete Form] -->
	<dialog id="notesFormContainer" class="notesFormContainer">
		<!-- Head -->
		<div class="noteInputTitle">
			<h1 class="noteStatus">Add Note</h1>
			<button id="closeForm" class="closeForm">✖</button>
		</div>
		<!-- Main Body Form -->
		<form id="notesForm" class="notesForm">
			<!-- Note Title -->
			<div class="titleForm">
				<label for="noteTitle">TITLE</label>
				<input type="text" name="noteTitle" id="noteTitle" autofocus aria-required="true">
			</div>
			<!-- Note Content -->
			<div class="contentForm">
				<label for="noteContent">CONTENT</label>
				<textarea name="noteContent" id="noteContent" placeholder="Add note Content..." required
					aria-required="true"></textarea>
			</div>
			<!-- Note Options [Delete / Close / Submit] -->
			<div class="buttonHolder">
				<button type="button" id="dynmChange">Delete</button>
				<button type="button" id="submitnote">Submit</button>
			</div>
		</form>
	</dialog>
</body>

</html>
